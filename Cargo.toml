[workspace]
resolver = "3"
members = [
    "apps/desktop/src-tauri",
    "crates/openbrief-app",
    "crates/openbrief-agent",
    "crates/openbrief-client",
    "crates/openbrief-cli",
    "crates/openbrief-core",
    "crates/openbrief-protocol",
    "crates/openbrief-source-niri",
    "crates/openbrief-store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
agent-client-protocol = "2.0.0"
axum = { version = "0.8.4", features = ["ws"] }
clap = { version = "4.6.4", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
directories = "6.0.0"
futures-util = "0.3.31"
niri-ipc = "=26.4.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rmcp = { version = "3.0.1", features = ["macros", "server", "transport-io"] }
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.25.0"
thiserror = "2.0.19"
time = { version = "0.3.54", features = ["formatting", "local-offset", "macros", "parsing", "serde"] }
tokio = { version = "1.49.0", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "1.1.4"
uuid = { version = "1.22.0", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
